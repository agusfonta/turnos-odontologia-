name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: turnos
          POSTGRES_PASSWORD: turnos
          POSTGRES_DB: turnos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://turnos:turnos@localhost:5432/turnos
      TEST_DATABASE_URL: postgresql+psycopg://turnos:turnos@localhost:5432/turnos
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-sintetico
      WA_PROVIDER_API_KEY: ci-wa-key-sintetica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Pytest
        run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
